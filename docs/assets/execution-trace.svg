<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Interrupting a turn with running tools.</title><desc id="desc">Both calls enter conversation history before execution. completed_read finishes before interruption. held_read remains active. Two interrupt requests wait for held cleanup; the runtime preserves the successful observation and marks only the unfinished call Error, then continues without replay.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18252c}.mono{font-family:ui-monospace,Consolas,monospace}.muted{fill:#57656b}.eyebrow{font-weight:700;letter-spacing:1.4px}.small{font-size:16px}.body{font-size:19px}.strong{font-weight:650}.cyan{fill:#086c76}.amber{fill:#92520b}.rust{fill:#a33739}</style>
<rect width="1000" height="320" rx="16" fill="#f5f3ed"/>
<path d="M30 61H970" stroke="#d9ddd8"/>
<text x="30" y="37" class="small eyebrow">01 / EXECUTE</text>
<text x="459" y="37" class="small eyebrow rust">02 / INTERRUPT ×2</text>
<text x="765" y="37" class="small eyebrow cyan">03 / RECOVER</text>
<text x="30" y="92" class="small muted">Calls recorded before tool entry</text>
<text x="30" y="133" class="body mono strong">completed_read</text>
<text x="30" y="211" class="body mono strong">held_read</text>
<path d="M242 126H720M242 204H720" stroke="#d8dcd8" stroke-width="4"/>
<path d="M244 126H384" stroke="#087d87" stroke-width="10" stroke-linecap="round"/>
<circle cx="384" cy="126" r="8" fill="#087d87"/>
<text x="260" y="155" class="small cyan">result committed</text>
<path d="M395 126H716" stroke="#9eafa9" stroke-dasharray="4 6" stroke-width="2"/>
<path d="M244 204H463" stroke="#c68a35" stroke-width="10" stroke-linecap="round"/>
<path d="M463 68V236" stroke="#a33739" stroke-width="2" stroke-dasharray="4 5"/>
<rect x="465" y="187" width="235" height="34" rx="6" fill="#d8ecea"/>
<text x="487" y="210" class="small cyan strong">wait for tool cleanup</text>
<rect x="741" y="102" width="229" height="54" rx="8" fill="#e1eeea"/>
<text x="755" y="124" class="small cyan strong">SUCCESS PRESERVED</text>
<text x="755" y="145" class="small mono">completed-evidence</text>
<rect x="741" y="180" width="229" height="54" rx="8" fill="#f3e3df"/>
<text x="755" y="202" class="small rust strong">UNFINISHED → ERROR</text>
<text x="755" y="223" class="small">after cleanup finishes</text>
<rect x="30" y="259" width="940" height="40" rx="7" fill="#19282e"/>
<text x="50" y="285" style="fill:#fffaf0;font-size:18px;font-weight:600">Next turn</text>
<text x="180" y="285" style="fill:#c6e3df;font-size:18px">same runtime · complete history · no tool replay</text>
</svg>