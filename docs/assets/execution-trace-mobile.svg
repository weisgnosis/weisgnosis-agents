<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 534" role="img" aria-labelledby="title desc"><title id="title">Interruption preserves completed work</title><desc id="desc">Tool calls enter history before execution. One read succeeds; another is interrupted. Cancellation waits for owned cleanup. The completed result survives, the unfinished call becomes Error, and the next turn continues without repeating either tool.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18252c}.mono{font-family:ui-monospace,Consolas,monospace}.muted{fill:#57656b}.eyebrow{font-weight:700;letter-spacing:1.4px}.small{font-size:16px}.body{font-size:19px}.strong{font-weight:650}.cyan{fill:#086c76}.amber{fill:#92520b}.rust{fill:#a33739}</style>
<rect width="360" height="534" rx="14" fill="#f5f3ed"/>
<text x="20" y="32" class="small eyebrow">01 / EXECUTE</text>
<text x="20" y="60" class="small muted">Calls recorded before tool entry</text>
<rect x="20" y="78" width="320" height="92" rx="9" fill="#e1eeea"/>
<text x="35" y="105" class="body mono strong">completed_read</text>
<text x="35" y="132" class="small cyan strong">SUCCESS → committed to history</text>
<text x="35" y="154" class="small mono">completed-evidence</text>
<text x="35" y="202" class="body mono strong">held_read</text>
<text x="35" y="228" class="small amber">still running when host interrupts</text>
<path d="M20 247H340" stroke="#d7dcd7"/>
<text x="20" y="281" class="small eyebrow rust">02 / INTERRUPT ×2</text>
<text x="20" y="312" class="small">Cancellation waits for owned cleanup.</text>
<path d="M20 332H340" stroke="#087d87" stroke-width="4"/>
<text x="20" y="369" class="small eyebrow cyan">03 / RECOVER</text>
<text x="20" y="399" class="small">Completed result preserved.</text>
<text x="20" y="426" class="small">Only unfinished call receives Error.</text>
<rect x="20" y="454" width="320" height="60" rx="8" fill="#19282e"/>
<text x="35" y="479" style="fill:#fffaf0;font-size:17px;font-weight:600">Next turn · same runtime</text>
<text x="35" y="502" style="fill:#c6e3df;font-size:16px">Complete history. No tool replay.</text>
</svg>