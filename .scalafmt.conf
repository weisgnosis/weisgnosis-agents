version = "3.8.4"
runner.dialect = scala3

maxColumn = 100
indent.main = 2
indent.significant = 2

align.preset = more
align.stripMargin = true

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortModifiers
]

docstrings.style = Asterisk
docstrings.wrap = no

fileOverride {
  "glob:**/agent/*.scala" {
    rewrite.scala3.convertToNewSyntax = true
    rewrite.scala3.removeOptionalBraces = true
  }
  "glob:**/harness/**/*.scala" {
    rewrite.scala3.convertToNewSyntax = true
    rewrite.scala3.removeOptionalBraces = true
  }
}
