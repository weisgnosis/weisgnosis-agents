name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify Formatting, Compilation, Tests, and Packages
        run: sbt verify packageArtifacts

      - name: Setup Python for Artifact Inspection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect and Stage Fresh Packaged Artifacts
        run: python verification/artifact-consumer/prepare.py

      - name: Verify External Packaged API Consumer
        working-directory: verification/artifact-consumer
        run: sbt scalafmtCheckAll scalafmtSbtCheck compile run
