name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JDK_JAVA_OPTIONS: '-Xms256m -Xmx4g -Xss16m'
      WEISGNOSIS_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/fixture
      WEISGNOSIS_POSTGRES_USER: fixture
      WEISGNOSIS_POSTGRES_PASSWORD: fixture-password

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify Formatting, Compilation, Tests, and Packages
        run: sbt verify packageArtifacts

      - name: Inspect Fresh Artifacts and Source-Archive Regressions
        run: sbt "artifactVerification / runMain com.weisgnosis.agents.verification.CheckPreparation"

      - name: Verify External Packaged API Consumer
        working-directory: verification/artifact-consumer
        run: sbt scalafmtCheckAll scalafmtSbtCheck compile run
